  const pad = n => String(n).padStart(2,'0');
  return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;

/* Référence automatique : MATIÈRE-NUANCE-ÉPAISSEURxLONGUEURxLARGEUR-SÉQUENCE */
const MATIERE_CODES = {
  'Acier':'AC', 'Acier galvanisé':'GA', 'Inox':'IX', 'Aluminium':'AL', 'Cuivre':'CU', 'Autre':'XX'
};
function slugPart(str){
  return String(str||'').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^A-Z0-9]+/g,'').slice(0,12);

function buildRefBase(matiere, nuance, epaisseur, longueur, largeur){
  const parts = [MATIERE_CODES[matiere] || 'XX'];

  const ep = String(epaisseur).replace('.', ',');
  parts.push(`${ep}X${longueur}X${largeur}`);

function generateRef(matiere, nuance, epaisseur, longueur, largeur, excludeId){
  const base = buildRefBase(matiere, nuance, epaisseur, longueur, largeur);

    .map(t => { const m = t.ref.match(/-(\d{3,})$/); return m ? parseInt(m[1], 10) : 0; });
  const next = nums.length ? Math.max(...nums) + 1 : 1;
  return `${base}-${String(next).padStart(3,'0')}`;
}

let unsubToles = null, unsubZones = null, unsubSettings = null, unsubEmbPieces = null, unsubEmbOutils = null;

function detachListeners(){
  if(unsubToles){ unsubToles(); unsubToles = null; }
  if(unsubZones){ unsubZones(); unsubZones = null; }
  if(unsubSettings){ unsubSettings(); unsubSettings = null; }
  if(unsubEmbPieces){ unsubEmbPieces(); unsubEmbPieces = null; }
  if(unsubEmbOutils){ unsubEmbOutils(); unsubEmbOutils = null; }
}

async function loadData(){
  await new Promise((resolve)=>{
    let done = 0;
    const TOTAL = 5;
    const checkDone = ()=>{ done++; if(done>=TOTAL) resolve(); };

    unsubToles = db.collection('toles').onSnapshot(snap=>{
      toles = snap.docs.map(d=>{
        const data = d.data();
        return {
          id: uid(), _fbId: d.id,
          ref: data.ref || '', matiere: data.matiere || 'Acier', nuance: data.nuance || '',
          epaisseur: Number(data.epaisseur) || 0, longueur: Number(data.longueur) || 0, largeur: Number(data.largeur) || 0,
          qte: Number(data.qte) || 0, seuil: Number(data.seuil) || 0, zone: data.zone || '', palette: data.palette || '',
          secteur: data.secteur || 'Autre',
          attachment: data.attachment || null,
          dateCreation: data.dateCreation || null, dateModification: data.dateModification || null
        };
      });
      serverIdSnapshots.toles = new Set(toles.map(t=>t._fbId));
      if(done>=TOTAL) renderLiveSafe();
      checkDone();
    }, e=>{ console.error(e); toles = []; toast('Impossible de charger le stock depuis Firebase'); checkDone(); });

    unsubZones = db.collection('zones').onSnapshot(snap=>{
      zones = snap.docs.map(d=>({ code: d.id, nom: d.data().nom || d.id }));
      serverIdSnapshots.zones = new Set(zones.map(z=>z.code));
      if(done>=TOTAL) renderLiveSafe();
      checkDone();
    }, e=>{ console.error(e); zones = []; toast('Impossible de charger les zones depuis Firebase'); checkDone(); });

    unsubSettings = db.collection('config').doc('settings').onSnapshot(sdoc=>{
      if(sdoc.exists){
        const d = sdoc.data();
        settings = {
          paletteStart: Number(d.paletteStart) || 1,
          defaultLongueur: Number(d.defaultLongueur) || 1000,
          defaultLargeur: Number(d.defaultLargeur) || 1000,
          defaultEpaisseur: Number(d.defaultEpaisseur) || 1,
          defaultMatiere: d.defaultMatiere || 'Acier',
          defaultSeuil: Number(d.defaultSeuil) || 1,
        };
      }
      if(done>=TOTAL) renderLiveSafe();
      checkDone();
    }, e=>{ console.error(e); checkDone(); });

    unsubEmbPieces = db.collection('embPieces').onSnapshot(snap=>{
      embPieces = snap.docs.map(d=> Object.assign(defaultEmbPiece(), d.data(), { id: uid(), _fbId: d.id }));
      serverIdSnapshots.embPieces = new Set(embPieces.map(p=>p._fbId));
      if(done>=TOTAL) renderLiveSafe();
      checkDone();
    }, e=>{ console.error(e); embPieces = []; checkDone(); });

    unsubEmbOutils = db.collection('embOutils').onSnapshot(snap=>{
      embOutils = snap.docs.map(d=> Object.assign(defaultEmbOutil(), d.data(), { id: uid(), _fbId: d.id }));
      serverIdSnapshots.embOutils = new Set(embOutils.map(o=>o._fbId));
      if(done>=TOTAL) renderLiveSafe();
      checkDone();
    }, e=>{ console.error(e); embOutils = []; checkDone(); });
  });
}

async function saveSettings(){
  try{
    await db.collection('config').doc('settings').set(settings);
  }catch(e){ console.error(e); toast('Impossible d\'enregistrer les paramètres'); }
}

async function saveEmbPieces(){
  try{
    const currentIds = new Set(embPieces.filter(p=>p._fbId).map(p=>p._fbId));
    const removed = [...(serverIdSnapshots.embPieces || new Set())].filter(id=>!currentIds.has(id));
    for(const id of removed){ await db.collection('embPieces').doc(id).delete(); }
    for(const p of embPieces){
      const fields = Object.assign({}, p);
      delete fields.id; delete fields._fbId;
      fields.dateModification = new Date().toISOString();
      if(p._fbId){ await db.collection('embPieces').doc(p._fbId).set(fields); }
      else{ const ref = await db.collection('embPieces').add(fields); p._fbId = ref.id; }
    }
    serverIdSnapshots.embPieces = new Set(embPieces.filter(p=>p._fbId).map(p=>p._fbId));
  }catch(e){ console.error(e); toast('Erreur de synchronisation Firebase — vérifiez la console'); }
}

async function saveEmbOutils(){
  try{
    const currentIds = new Set(embOutils.filter(o=>o._fbId).map(o=>o._fbId));
    const removed = [...(serverIdSnapshots.embOutils || new Set())].filter(id=>!currentIds.has(id));
    for(const id of removed){ await db.collection('embOutils').doc(id).delete(); }
    for(const o of embOutils){
      const fields = Object.assign({}, o);
      delete fields.id; delete fields._fbId;
      fields.dateModification = new Date().toISOString();
      if(o._fbId){ await db.collection('embOutils').doc(o._fbId).set(fields); }
      else{ const ref = await db.collection('embOutils').add(fields); o._fbId = ref.id; }
    }
    serverIdSnapshots.embOutils = new Set(embOutils.filter(o=>o._fbId).map(o=>o._fbId));
  }catch(e){ console.error(e); toast('Erreur de synchronisation Firebase — vérifiez la console'); }
}

async function saveToles(){
  try{
    const currentIds = new Set(toles.filter(t=>t._fbId).map(t=>t._fbId));
    const removed = [...(serverIdSnapshots.toles || new Set())].filter(id=>!currentIds.has(id));
    for(const id of removed){ await db.collection('toles').doc(id).delete(); }
    for(const t of toles){
      const fields = {
        ref: t.ref, matiere: t.matiere, nuance: t.nuance || '',
        epaisseur: t.epaisseur, longueur: t.longueur, largeur: t.largeur,
        qte: t.qte, seuil: t.seuil, zone: t.zone || '', palette: t.palette || '',
        secteur: t.secteur || 'Autre',
        attachment: t.attachment || null,
        dateCreation: t.dateCreation || new Date().toISOString(),
        dateModification: t.dateModification || new Date().toISOString()
      };
      if(t._fbId){
        await db.collection('toles').doc(t._fbId).set(fields);
      }else{
        const ref = await db.collection('toles').add(fields);
        t._fbId = ref.id;
      }
    }
    serverIdSnapshots.toles = new Set(toles.filter(t=>t._fbId).map(t=>t._fbId));
  }catch(e){ console.error(e); toast('Erreur de synchronisation Firebase — vérifiez la console'); }
}

async function saveZones(){
  try{
    const currentCodes = new Set(zones.map(z=>z.code));
    const removed = [...(serverIdSnapshots.zones || new Set())].filter(c=>!currentCodes.has(c));
    for(const c of removed){ await db.collection('zones').doc(c).delete(); }
    for(const z of zones){ await db.collection('zones').doc(z.code).set({ nom: z.nom }); }
    serverIdSnapshots.zones = new Set(currentCodes);
  }catch(e){ console.error(e); toast('Erreur de synchronisation Firebase — vérifiez la console'); }
}

function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(()=> el.classList.remove('show'), 2400);
}

function compressImageFile(file, maxDim=1280, quality=0.72){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > h && w > maxDim){ h = Math.round(h*maxDim/w); w = maxDim; }
        else if(h >= w && h > maxDim){ w = Math.round(w*maxDim/h); h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = ()=>reject(new Error('Image illisible'));
      img.src = reader.result;
    };
    reader.onerror = ()=>reject(new Error('Lecture du fichier impossible'));
    reader.readAsDataURL(file);
  });
}
function readFileAsDataUrl(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>resolve(reader.result);
    reader.onerror = ()=>reject(new Error('Lecture du fichier impossible'));
    reader.readAsDataURL(file);
  });
}

  overlay.querySelector('#cancel-modal').onclick = ()=> overlay.remove();

  const refInput = overlay.querySelector('#f-ref');
  const matiereSel = overlay.querySelector('#f-matiere');
  const nuanceInput = overlay.querySelector('#f-nuance');
  const epInput = overlay.querySelector('#f-ep');
  const longInput = overlay.querySelector('#f-long');
  const largInput = overlay.querySelector('#f-larg');
  let refManuallyEdited = editing && !!t.ref;

  function recomputeRef(){
    if(refManuallyEdited) return;
    refInput.value = generateRef(
      matiereSel.value, nuanceInput.value,
      parseFloat(epInput.value) || 0,
      parseInt(longInput.value) || 0,
      parseInt(largInput.value) || 0,
      editing ? t.id : null
    );
  }
  [matiereSel, nuanceInput, epInput, longInput, largInput].forEach(el=>{
    el.addEventListener('input', recomputeRef);
  });
  refInput.addEventListener('input', ()=>{ refManuallyEdited = true; });
  overlay.querySelector('#regen-ref').addEventListener('click', ()=>{
    refManuallyEdited = false;
    recomputeRef();
  });
  if(!editing) recomputeRef();

  function renderAttachPreview(){
    const el = overlay.querySelector('#attach-preview');
    if(!attachment){
      el.innerHTML = `<span class="hint" style="font-size:12px;color:var(--ink-dim);">Aucun fichier joint.</span>`;
      return;
    }
    const isImg = attachment.type && attachment.type.startsWith('image/');
    el.innerHTML = `
      <div style="display:flex;align-items:center;gap:10px;">
        ${isImg
          ? `<img src="${attachment.dataUrl}" style="width:56px;height:56px;object-fit:cover;border-radius:var(--radius);border:1px solid var(--line);">`
          : `<div style="width:56px;height:56px;display:flex;align-items:center;justify-content:center;background:var(--panel-2);border-radius:var(--radius);border:1px solid var(--line);font-size:20px;">📄</div>`}
        <div style="flex:1;font-size:12px;color:var(--ink-dim);word-break:break-all;">${escapeHtml(attachment.name)}</div>
        <button type="button" class="btn ghost small" id="btn-remove-attach">Retirer</button>
      </div>`;
    el.querySelector('#btn-remove-attach').onclick = ()=>{ attachment = null; renderAttachPreview(); };
  }
  renderAttachPreview();

  overlay.querySelector('#btn-take-photo').onclick = ()=> overlay.querySelector('#f-photo-capture').click();
  overlay.querySelector('#btn-choose-file').onclick = ()=> overlay.querySelector('#f-file-attach').click();

  overlay.querySelector('#f-photo-capture').onchange = async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    try{
      const dataUrl = await compressImageFile(file);
      if(dataUrl.length > 700000){ toast('Photo trop volumineuse même compressée — réessaie.'); return; }
      attachment = { name: file.name || 'photo.jpg', type: 'image/jpeg', dataUrl };
      renderAttachPreview();
    }catch(err){ console.error(err); toast('Impossible de traiter la photo'); }
    e.target.value = '';
  };

  overlay.querySelector('#f-file-attach').onchange = async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    try{
      let dataUrl;
      if(file.type && file.type.startsWith('image/')){
        dataUrl = await compressImageFile(file);
      }else{
        dataUrl = await readFileAsDataUrl(file);
      }
      if(dataUrl.length > 700000){ toast('Fichier trop volumineux (limite ~500 Ko) — choisis un fichier plus léger.'); return; }
      attachment = { name: file.name, type: file.type || 'application/octet-stream', dataUrl };
      renderAttachPreview();
    }catch(err){ console.error(err); toast('Impossible de lire ce fichier'); }
    e.target.value = '';
  };

  overlay.querySelector('#save-tole').onclick = async ()=>{
    const ref = overlay.querySelector('#f-ref').value.trim();
    if(!ref){ toast('La référence est requise'); return; }
    t.ref = ref;
    t.matiere = overlay.querySelector('#f-matiere').value;
    t.nuance = overlay.querySelector('#f-nuance').value.trim();
    t.secteur = overlay.querySelector('#f-secteur').value;
    t.palette = overlay.querySelector('#f-palette').value.trim();
    t.epaisseur = parseFloat(overlay.querySelector('#f-ep').value) || 0;
    t.longueur = parseInt(overlay.querySelector('#f-long').value) || 0;
    t.largeur = parseInt(overlay.querySelector('#f-larg').value) || 0;
    t.qte = parseInt(overlay.querySelector('#f-qte').value) || 0;
    t.seuil = parseInt(overlay.querySelector('#f-seuil').value) || 0;
    t.zone = overlay.querySelector('#f-zone').value;
    t.attachment = attachment;
    const now = new Date().toISOString();
    if(!editing){
      t.dateCreation = now;
      t.dateModification = now;
      toles.push(t);
    }else{
      t.dateModification = now;
    }
    await saveToles();
    overlay.remove();
    toast(editing ? 'Tôle mise à jour' : 'Tôle ajoutée');
    render();
  };
}

function deriveRack(code){
  const m = String(code||'').match(/^[^\d]+/);
  return (m ? m[0] : code).replace(/[-_\s]+$/,'') || code;
}

    if(autre){
      return { code: slugPart(autre), nom: autre };

    const z = computeZone();
    preview.textContent = z ? `Code généré : ${z.code}  —  ${z.nom}` : 'Renseignez au moins Rack, ou Autre.';
  }
  [rackInput, etagereInput, autreInput].forEach(el=> el.addEventListener('input', updatePreview));

    renderZones();
  };
}

let nestSheet = { longueur: 2000, largeur: 1000 };
let nestGap = 5;
let nestParts = []; // { id, nom, longueur, largeur, qte, source }

function parseDxfBoundingBox(text){
  const parser = new DxfParser();
  const dxf = parser.parseSync(text);
  let minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity;
  function pt(x,y){ if(x<minX)minX=x; if(x>maxX)maxX=x; if(y<minY)minY=y; if(y>maxY)maxY=y; }
  (dxf.entities||[]).forEach(e=>{
    if(e.vertices){ e.vertices.forEach(v=>pt(v.x,v.y)); }
    if(e.startPoint) pt(e.startPoint.x, e.startPoint.y);
    if(e.endPoint) pt(e.endPoint.x, e.endPoint.y);
    if(e.center && e.radius!=null){ pt(e.center.x-e.radius, e.center.y-e.radius); pt(e.center.x+e.radius, e.center.y+e.radius); }
    if(e.position) pt(e.position.x, e.position.y);
  });
  if(!isFinite(minX)) throw new Error('Aucune géométrie exploitable trouvée dans le DXF.');
  return { longueur: Math.round(maxX-minX), largeur: Math.round(maxY-minY) };
}

/* Table de tous les CARTESIAN_POINT du fichier STEP, indexée par identifiant #id.
   Partagée par les deux lecteurs STEP approximatifs de l'application. */
function stepCartesianPoints(text){
  const re = /#(\d+)\s*=\s*CARTESIAN_POINT\s*\(\s*'[^']*'\s*,\s*\(([^)]+)\)\s*\)/g;
  const pts = {};
  let m;
  while((m = re.exec(text))){
    const vals = m[2].split(',').map(s=>parseFloat(s.trim()));
    if(vals.length>=2 && vals.every(isFinite)) pts[m[1]] = vals;
  }
  return pts;
}

function parseStepBoundingBoxApprox(text){
  const pts = stepCartesianPoints(text);
  // On ne garde que les points réellement utilisés comme sommets de la pièce (VERTEX_POINT) :
  // les CARTESIAN_POINT bruts incluent aussi les origines de repères (AXIS2_PLACEMENT_3D) et les
  // points de construction des courbes, qui faussent complètement la boîte englobante (souvent
  // un point à l'origine (0,0,0) du repère global, très loin de la pièce elle-même).
  const vertexRe = /VERTEX_POINT\s*\(\s*'[^']*'\s*,\s*#(\d+)\s*\)/g;
  let m, minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity, found=0;
  while((m = vertexRe.exec(text))){
    const v = pts[m[1]];
    if(!v) continue;
    found++;
    if(v[0]<minX)minX=v[0]; if(v[0]>maxX)maxX=v[0];
    if(v[1]<minY)minY=v[1]; if(v[1]>maxY)maxY=v[1];
  }
  if(!found){
    Object.values(pts).forEach(v=>{
      if(v[0]<minX)minX=v[0]; if(v[0]>maxX)maxX=v[0];
      if(v[1]<minY)minY=v[1]; if(v[1]>maxY)maxY=v[1];
    });
  }
  if(!isFinite(minX)) throw new Error('Aucun point exploitable trouvé dans le fichier STEP.');
  return { longueur: Math.round(maxX-minX), largeur: Math.round(maxY-minY) };
}

/* Algorithme MaxRects (Maximal Rectangles, Best-Short-Side-Fit) avec rotation 90°,
   nettement plus performant qu'un simple rangement par rangées. */
function packMaxRects(sheetL, sheetW, units, gap){
  let freeRects = [{x:0, y:0, w:sheetL, h:sheetW}];
  const placed = [];
  const unplaced = [];

  function isContainedIn(a,b){
    return a.x>=b.x && a.y>=b.y && a.x+a.w<=b.x+b.w && a.y+a.h<=b.y+b.h;
  }
  function pruneFreeList(){
    for(let i=0;i<freeRects.length;i++){
      for(let j=i+1;j<freeRects.length;j++){
        if(isContainedIn(freeRects[i], freeRects[j])){ freeRects.splice(i,1); i--; break; }
        if(isContainedIn(freeRects[j], freeRects[i])){ freeRects.splice(j,1); j--; }
      }
    }
  }
  function splitFreeNode(fr, used){
    if(used.x >= fr.x+fr.w || used.x+used.w <= fr.x || used.y >= fr.y+fr.h || used.y+used.h <= fr.y) return null;
    const out = [];
    if(used.x > fr.x) out.push({x:fr.x, y:fr.y, w:used.x-fr.x, h:fr.h});
    if(used.x+used.w < fr.x+fr.w) out.push({x:used.x+used.w, y:fr.y, w:fr.x+fr.w-(used.x+used.w), h:fr.h});
    if(used.y > fr.y) out.push({x:fr.x, y:fr.y, w:fr.w, h:used.y-fr.y});
    if(used.y+used.h < fr.y+fr.h) out.push({x:fr.x, y:used.y+used.h, w:fr.w, h:fr.y+fr.h-(used.y+used.h)});
    return out;
  }
  function findPosition(w, h){
    let bestShort=Infinity, bestLong=Infinity, best=null, bestRotated=false;
    freeRects.forEach(fr=>{
      if(fr.w >= w && fr.h >= h){
        const sf = Math.min(fr.w-w, fr.h-h), lf = Math.max(fr.w-w, fr.h-h);
        if(sf < bestShort || (sf===bestShort && lf<bestLong)){ bestShort=sf; bestLong=lf; best={x:fr.x,y:fr.y,w,h}; bestRotated=false; }
      }
      if(fr.w >= h && fr.h >= w){
        const sf = Math.min(fr.w-h, fr.h-w), lf = Math.max(fr.w-h, fr.h-w);
        if(sf < bestShort || (sf===bestShort && lf<bestLong)){ bestShort=sf; bestLong=lf; best={x:fr.x,y:fr.y,w:h,h:w}; bestRotated=true; }
      }
    });
    return best ? {rect:best, rotated:bestRotated} : null;
  }

  units.forEach(u=>{
    const gw = u.w + gap, gh = u.h + gap;
    const found = findPosition(gw, gh);
    if(!found){ unplaced.push(u); return; }
    const node = found.rect;
    placed.push({ nom:u.nom, x:node.x, y:node.y, w: found.rotated ? u.h : u.w, h: found.rotated ? u.w : u.h, rotated: found.rotated });
    const numFree = freeRects.length;
    for(let i=0;i<numFree;i++){
      const splits = splitFreeNode(freeRects[i], node);
      if(splits){ freeRects.splice(i,1); i--; freeRects.push(...splits); }
    }
    pruneFreeList();
  });

  return { placed, unplaced };
}

function estimateMaxUnitsCount(partL, partW, sheetL, sheetW, gap){
  const area = (partL+gap)*(partW+gap);
  if(area<=0 || partL<=0 || partW<=0) return 0;
  return Math.min(3000, Math.ceil((sheetL*sheetW)/area) + 4);
}

function calcMaxPourPiece(p){
  const sheetL = nestSheet.longueur, sheetW = nestSheet.largeur, gap = nestGap;
  const n = estimateMaxUnitsCount(p.longueur, p.largeur, sheetL, sheetW, gap);
  if(n<=0) return 0;
  const units = Array.from({length:n}, ()=>({nom:p.nom, w:p.longueur, h:p.largeur}));
  const result = packMaxRects(sheetL, sheetW, units, gap);
  return result.placed.length;
}

function nestCompute(){
  const sheetL = nestSheet.longueur, sheetW = nestSheet.largeur, gap = nestGap;
  const baseUnits = [];
  nestParts.forEach(p=>{
    for(let i=0;i<p.qte;i++) baseUnits.push({ partId:p.id, nom:p.nom, l:p.longueur, w:p.largeur });
  });

  // On essaie plusieurs stratégies de tri et on garde la meilleure imbrication obtenue.
  const strategies = [
    (a,b)=> (b.l*b.w) - (a.l*a.w),                 // surface décroissante
    (a,b)=> Math.max(b.l,b.w) - Math.max(a.l,a.w), // plus grand côté décroissant
    (a,b)=> Math.min(b.l,b.w) - Math.min(a.l,a.w), // plus petit côté décroissant
    (a,b)=> (b.l+b.w) - (a.l+a.w),                 // périmètre décroissant
  ];

  let best = null;
  strategies.forEach(cmp=>{
    const normalized = baseUnits.slice().sort(cmp).map(u=>({ nom:u.nom, w:u.l, h:u.w }));
    const result = packMaxRects(sheetL, sheetW, normalized, gap);
    const surfaceUtile = result.placed.reduce((s,p)=>s+p.w*p.h,0);
    const score = result.placed.length*1e9 + surfaceUtile; // priorité : nb de pièces placées, puis surface utilisée
    if(!best || score > best.score){ best = { ...result, score }; }
  });

  const surfaceFeuille = sheetL * sheetW;
  const surfaceUtile = best.placed.reduce((s,p)=>s+p.w*p.h,0);
  const taux = surfaceFeuille>0 ? Math.round(surfaceUtile/surfaceFeuille*1000)/10 : 0;
  return { placed: best.placed, unplaced: best.unplaced, taux, totalDemande: baseUnits.length };
}

/* ---------------------------------------------------------
   DÉCOUPE LASER — lecture DXF, longueur de coupe et temps estimé
--------------------------------------------------------- */
let laserParams = { vitesse: 3000, tempsPercage: 0.5, vitesseRapide: 15000, matiere: 'Acier', epaisseur: 3 };
let laserResult = null;
let laserFileName = '';

const LASER_PRESETS = {
  'Acier':      { 1: 6000, 2: 4000, 3: 3000, 5: 1800, 8: 1000 },
  'Inox':       { 1: 5000, 2: 3000, 3: 2000 },
  'Aluminium':  { 1: 4000, 2: 2500, 3: 1500 },
};

function dist(x1,y1,x2,y2){ return Math.hypot(x2-x1, y2-y1); }

function analyzeDxfForLaser(text){
  const parser = new DxfParser();
  const dxf = parser.parseSync(text);
  const entities = dxf.entities || [];
  let totalLength = 0;
  let pierces = 0;
  let minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity;
  function bboxPt(x,y){ if(x<minX)minX=x; if(x>maxX)maxX=x; if(y<minY)minY=y; if(y>maxY)maxY=y; }

  entities.forEach(e=>{
    if(e.type === 'LINE' && e.vertices && e.vertices.length>=2){
      totalLength += dist(e.vertices[0].x,e.vertices[0].y,e.vertices[1].x,e.vertices[1].y);
      e.vertices.forEach(v=>bboxPt(v.x,v.y));
      pierces++;
    }
    else if((e.type === 'LWPOLYLINE' || e.type === 'POLYLINE') && e.vertices && e.vertices.length>1){
      for(let i=0;i<e.vertices.length-1;i++){
        totalLength += dist(e.vertices[i].x,e.vertices[i].y,e.vertices[i+1].x,e.vertices[i+1].y);
      }
      if(e.shape || e.closed){
        totalLength += dist(e.vertices[e.vertices.length-1].x,e.vertices[e.vertices.length-1].y,e.vertices[0].x,e.vertices[0].y);
      }
      e.vertices.forEach(v=>bboxPt(v.x,v.y));
      pierces++;
    }
    else if(e.type === 'CIRCLE' && e.center && e.radius){
      totalLength += 2*Math.PI*e.radius;
      bboxPt(e.center.x-e.radius, e.center.y-e.radius); bboxPt(e.center.x+e.radius, e.center.y+e.radius);
      pierces++;
    }
    else if(e.type === 'ARC' && e.center && e.radius!=null){
      let a1 = e.startAngle, a2 = e.endAngle;
      let sweep = a2 - a1;
      if(sweep < 0) sweep += 2*Math.PI;
      totalLength += e.radius * sweep;
      bboxPt(e.center.x-e.radius, e.center.y-e.radius); bboxPt(e.center.x+e.radius, e.center.y+e.radius);
      pierces++;
    }
    else if(e.type === 'SPLINE' && e.controlPoints && e.controlPoints.length>1){
      for(let i=0;i<e.controlPoints.length-1;i++){
        totalLength += dist(e.controlPoints[i].x,e.controlPoints[i].y,e.controlPoints[i+1].x,e.controlPoints[i+1].y);
      }
      e.controlPoints.forEach(v=>bboxPt(v.x,v.y));
      pierces++;
    }
    else if(e.type === 'ELLIPSE' && e.center && e.majorAxisEndPoint){
      const a = Math.hypot(e.majorAxisEndPoint.x, e.majorAxisEndPoint.y);
      const b = a * (e.axisRatio || 1);
      totalLength += Math.PI*(3*(a+b) - Math.sqrt((3*a+b)*(a+3*b))); // approximation de Ramanujan
      bboxPt(e.center.x-a, e.center.y-a); bboxPt(e.center.x+a, e.center.y+a);
      pierces++;
    }
  });

  if(pierces === 0) throw new Error('Aucune géométrie de découpe exploitable trouvée dans ce DXF.');
  const bbox = isFinite(minX) ? { minX, minY, maxX, maxY } : { minX:0, minY:0, maxX:0, maxY:0 };
  return { totalLength, pierces, entities, bbox };
}

function buildDxfSvg(entities, bbox){
  const w = Math.max(1, bbox.maxX - bbox.minX);
  const h = Math.max(1, bbox.maxY - bbox.minY);
  const pad = Math.max(w,h) * 0.04;
  const vbW = w+pad*2, vbH = h+pad*2;
  // Convertit un point DXF (Y vers le haut) en coordonnées SVG (Y vers le bas)
  function sx(x){ return (x - bbox.minX + pad); }
  function sy(y){ return vbH - (y - bbox.minY + pad); }

  let paths = '';
  entities.forEach(e=>{
    if(e.type === 'LINE' && e.vertices && e.vertices.length>=2){
      paths += `<line x1="${sx(e.vertices[0].x)}" y1="${sy(e.vertices[0].y)}" x2="${sx(e.vertices[1].x)}" y2="${sy(e.vertices[1].y)}"/>`;
    }
    else if((e.type === 'LWPOLYLINE' || e.type === 'POLYLINE') && e.vertices && e.vertices.length>1){
      const pts = e.vertices.map(v=>`${sx(v.x)},${sy(v.y)}`).join(' ');
      paths += (e.shape || e.closed) ? `<polygon points="${pts}"/>` : `<polyline points="${pts}"/>`;
    }
    else if(e.type === 'CIRCLE' && e.center && e.radius){
      paths += `<circle cx="${sx(e.center.x)}" cy="${sy(e.center.y)}" r="${e.radius}"/>`;
    }
    else if(e.type === 'ARC' && e.center && e.radius!=null){
      let a1=e.startAngle, a2=e.endAngle, sweep=a2-a1; if(sweep<0) sweep+=2*Math.PI;
      const x1 = e.center.x + e.radius*Math.cos(a1), y1 = e.center.y + e.radius*Math.sin(a1);
      const x2 = e.center.x + e.radius*Math.cos(a2), y2 = e.center.y + e.radius*Math.sin(a2);
      const large = sweep > Math.PI ? 1 : 0;
      paths += `<path d="M ${sx(x1)} ${sy(y1)} A ${e.radius} ${e.radius} 0 ${large} 0 ${sx(x2)} ${sy(y2)}"/>`;
    }
    else if(e.type === 'SPLINE' && e.controlPoints && e.controlPoints.length>1){
      const pts = e.controlPoints.map(v=>`${sx(v.x)},${sy(v.y)}`).join(' ');
      paths += `<polyline points="${pts}"/>`;
    }
    else if(e.type === 'ELLIPSE' && e.center && e.majorAxisEndPoint){
      const a = Math.hypot(e.majorAxisEndPoint.x, e.majorAxisEndPoint.y);
      const b = a * (e.axisRatio || 1);
      paths += `<ellipse cx="${sx(e.center.x)}" cy="${sy(e.center.y)}" rx="${a}" ry="${b}"/>`;
    }
  });

  const strokeW = Math.max(w,h) * 0.0025;
  return `<svg width="100%" height="100%" viewBox="0 0 ${vbW} ${vbH}" preserveAspectRatio="xMidYMid meet" style="background:#fff;display:block;">
    <g fill="none" stroke="#1a1a1a" stroke-width="${strokeW}">${paths}</g>
  </svg>`;
}

/* Rend un viewer DXF zoomable/déplaçable dans le conteneur #containerId.
   Molette = zoom (centré sur le curseur), glisser = déplacer, pincement 2 doigts = zoom tactile. */
function attachDxfZoomPan(containerId){
  const container = document.getElementById(containerId);
  if(!container) return;
  const svg = container.querySelector('svg');
  if(!svg) return;

  let scale = 1, tx = 0, ty = 0;
  const MIN_SCALE = 0.2, MAX_SCALE = 20;

  function apply(){
    svg.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
  }

  function zoomAt(cx, cy, factor){
    const newScale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, scale * factor));
    const ratio = newScale / scale;
    tx = cx - (cx - tx) * ratio;
    ty = cy - (cy - ty) * ratio;
    scale = newScale;
    apply();
  }

  function reset(){ scale = 1; tx = 0; ty = 0; apply(); }
  reset();

  container.addEventListener('wheel', (e)=>{
    e.preventDefault();
    const rect = container.getBoundingClientRect();
    const cx = e.clientX - rect.left, cy = e.clientY - rect.top;
    const factor = e.deltaY < 0 ? 1.15 : 1/1.15;
    zoomAt(cx, cy, factor);
  }, { passive:false });

  // Glisser à la souris
  let dragging = false, lastX=0, lastY=0;
  container.addEventListener('mousedown', (e)=>{
    dragging = true; lastX = e.clientX; lastY = e.clientY;
    container.classList.add('dragging');
  });
  window.addEventListener('mousemove', (e)=>{
    if(!dragging) return;
    tx += e.clientX - lastX; ty += e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    apply();
  });
  window.addEventListener('mouseup', ()=>{ dragging = false; container.classList.remove('dragging'); });

  // Tactile : un doigt = déplacer, deux doigts = pincer pour zoomer
  let touchMode = null, lastTouchDist = 0, lastTouchMid = {x:0,y:0};
  container.addEventListener('touchstart', (e)=>{
    if(e.touches.length === 1){
      touchMode = 'pan';
      lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
    }else if(e.touches.length === 2){
      touchMode = 'pinch';
      const [t1,t2] = e.touches;
      lastTouchDist = Math.hypot(t2.clientX-t1.clientX, t2.clientY-t1.clientY);
      const rect = container.getBoundingClientRect();
      lastTouchMid = { x:(t1.clientX+t2.clientX)/2 - rect.left, y:(t1.clientY+t2.clientY)/2 - rect.top };
    }
  }, { passive:true });
  container.addEventListener('touchmove', (e)=>{
    if(touchMode === 'pan' && e.touches.length === 1){
      const dx = e.touches[0].clientX - lastX, dy = e.touches[0].clientY - lastY;
      tx += dx; ty += dy;
      lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
      apply();
    }else if(touchMode === 'pinch' && e.touches.length === 2){
      const [t1,t2] = e.touches;
      const dist = Math.hypot(t2.clientX-t1.clientX, t2.clientY-t1.clientY);
      if(lastTouchDist > 0){ zoomAt(lastTouchMid.x, lastTouchMid.y, dist/lastTouchDist); }
      lastTouchDist = dist;
    }
    e.preventDefault();
  }, { passive:false });
  container.addEventListener('touchend', ()=>{ touchMode = null; lastTouchDist = 0; });

  container.querySelector('[data-zoom-in]')?.addEventListener('click', ()=>{
    const rect = container.getBoundingClientRect();
    zoomAt(rect.width/2, rect.height/2, 1.3);
  });
  container.querySelector('[data-zoom-out]')?.addEventListener('click', ()=>{
    const rect = container.getBoundingClientRect();
    zoomAt(rect.width/2, rect.height/2, 1/1.3);
  });
  container.querySelector('[data-zoom-reset]')?.addEventListener('click', reset);
}


function laserCompute(){
  if(!laserResult) return null;
  const v = laserParams.vitesse || 1;
  const tempsCoupeMin = laserResult.totalLength / v;
  const tempsPercageMin = (laserResult.pierces * laserParams.tempsPercage) / 60;
  const tempsTotalMin = tempsCoupeMin + tempsPercageMin;
  return { tempsCoupeMin, tempsPercageMin, tempsTotalMin };
}

function fmtMin(min){
  const totalSec = Math.round(min*60);
  const m = Math.floor(totalSec/60), s = totalSec%60;
  return `${m} min ${String(s).padStart(2,'0')} s`;
}

let scanStream = null;
let liveScanTimer = null;
let liveScanActive = false;

async function startLiveScanner(){
  const vf = document.getElementById('viewfinder');
  vf.innerHTML = `<div class="idle">Ouverture de la caméra…</div>`;
  try{
    scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
  }catch(e){
    console.error(e);
    vf.innerHTML = `<div class="idle">Accès caméra refusé ou indisponible.<br>Utilisez plutôt "Prendre une photo" ci-dessous.</div>`;
    return;
  }
  vf.innerHTML = `
    <video id="scan-video" playsinline muted autoplay></video>
    <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
    <div class="scan-line"></div>
  `;
  const video = document.getElementById('scan-video');
  video.srcObject = scanStream;
  await video.play();

  const detector = ('BarcodeDetector' in window) ? new BarcodeDetector({ formats: ['qr_code'] }) : null;
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });

  liveScanActive = true;
  let busy = false;

  liveScanTimer = setInterval(async ()=>{
    if(busy || !liveScanActive || video.readyState < video.HAVE_ENOUGH_DATA) return;
    busy = true;
    try{
      let value = null;
      if(detector){
        try{
          const results = await detector.detect(video);
          if(results && results.length) value = results[0].rawValue;
        }catch(err){ /* on retente avec jsQR ci-dessous sur cette même image */ }
      }
      if(!value){
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(imgData.data, imgData.width, imgData.height, { inversionAttempts: 'attemptBoth' });
        if(code && code.data) value = code.data;
      }
      if(value){
        stopLiveScanner();
        handleScanCode(value.trim().toUpperCase());
      }
    } finally {
      busy = false;
    }
  }, 350);
}

function stopLiveScanner(){
  liveScanActive = false;
  if(liveScanTimer){ clearInterval(liveScanTimer); liveScanTimer = null; }
  if(scanStream){ scanStream.getTracks().forEach(tr=>tr.stop()); scanStream = null; }
}

async function tryNativeBarcodeDetector(img){
  if(!('BarcodeDetector' in window)) return null;
  try{
    const detector = new BarcodeDetector({ formats: ['qr_code'] });
    const results = await detector.detect(img);
    if(results && results.length && results[0].rawValue) return results[0].rawValue;
  }catch(err){
    console.warn('BarcodeDetector indisponible ou en échec, repli sur jsQR:', err);
  }
  return null;
}

function decodeQrFromCanvas(ctx, w, h){
  const imgData = ctx.getImageData(0, 0, w, h);
  return jsQR(imgData.data, imgData.width, imgData.height, { inversionAttempts: 'attemptBoth' });
}

function tryDecodeAtScale(img, maxDim){
  const nw = img.naturalWidth, nh = img.naturalHeight;
  const scale = Math.min(1, maxDim / Math.max(nw, nh));
  const w = Math.max(1, Math.round(nw * scale));
  const h = Math.max(1, Math.round(nh * scale));
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(img, 0, 0, w, h);
  return decodeQrFromCanvas(ctx, w, h);
}

function tryDecodeCropped(img, cropFraction, targetSize){
  const nw = img.naturalWidth, nh = img.naturalHeight;
  const cropW = nw * cropFraction, cropH = nh * cropFraction;
  const sx = (nw - cropW) / 2, sy = (nh - cropH) / 2;
  const canvas = document.createElement('canvas');
  canvas.width = targetSize; canvas.height = targetSize;
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(img, sx, sy, cropW, cropH, 0, 0, targetSize, targetSize);
  return decodeQrFromCanvas(ctx, targetSize, targetSize);
}

async function onQrPhotoSelected(e){
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  const vf = document.getElementById('viewfinder');
  vf.innerHTML = `<div class="idle">Analyse de la photo…</div>`;

  const img = new Image();
  const url = URL.createObjectURL(file);

  img.onload = async ()=>{
    URL.revokeObjectURL(url);
    try{
      // 0. Détecteur natif du navigateur (même moteur que l'appareil photo du téléphone) — le plus fiable
      const native = await tryNativeBarcodeDetector(img);
      if(native){
        handleScanCode(native.trim().toUpperCase());
        return;
      }

      const nw = img.naturalWidth, nh = img.naturalHeight;
      let code = null;

      // 1. Repli : jsQR sur l'image entière, à plusieurs résolutions
      for(const maxDim of [2000, 1200, Math.max(nw, nh), 800]){
        code = tryDecodeAtScale(img, maxDim);
        if(code && code.data) break;
      }

      // 2. Repli : recadrage automatique sur le centre, agrandi
      if(!code || !code.data){
        for(const cropFraction of [0.6, 0.4, 0.25, 0.15]){
          code = tryDecodeCropped(img, cropFraction, 900);
          if(code && code.data) break;
        }
      }

      if(code && code.data){
        handleScanCode(code.data.trim().toUpperCase());
      }else{
        showScanFailure("Aucun QR code détecté sur cette photo.<br>Essayez de vous rapprocher un peu plus de l'étiquette et évitez les reflets.");
      }
    }catch(err){
      console.error('Erreur analyse QR:', err);
      showScanFailure("Erreur pendant l'analyse de la photo.<br>Réessayez avec une photo moins zoomée.");
    }
  };
  img.onerror = ()=>{
    showScanFailure("Impossible de lire cette photo.");
  };
  img.src = url;
}

        <div class="tag-code">${escapeHtml(zone.code)}</div>

        ${items.length===0 ? `<div class="lede" style="margin:0 0 12px">Aucune tôle affectée à cette zone pour l'instant.</div>` : `
          <table style="margin-bottom:12px">
            <thead><tr><th>Référence</th><th>Nuance</th><th>Palette</th><th>Dimensions</th><th>Qté</th></tr></thead>
            <tbody>
              ${items.map(t=>`<tr><td class="ref">${escapeHtml(t.ref)}</td><td class="dim">${t.nuance ? escapeHtml(t.nuance) : '—'}</td><td class="dim">${t.palette ? 'N°'+escapeHtml(t.palette) : '—'}</td><td class="dim">${t.longueur}×${t.largeur}×${t.epaisseur}mm</td><td>${t.qte}</td></tr>`).join('')}
            </tbody>
          </table>
        `}
        <button class="btn primary small" id="add-here">+ Ajouter une tôle dans cette zone</button>
      </div>
    `;
    document.getElementById('add-here').onclick = ()=> openToleModal(null, zone.code);
  }else{
    panel.innerHTML = `
      <div class="result-card notfound">
        <div class="tag-code">${escapeHtml(code)}</div>
        <div class="lede" style="margin:6px 0 12px">Cette zone n'existe pas encore dans le système.</div>
        <button class="btn primary small" id="create-zone-here">Créer cette zone</button>
      </div>
    `;
    document.getElementById('create-zone-here').onclick = ()=>{
      zones.push({ code, nom: code });
      saveZones();
      toast('Zone créée');
      handleScanCode(code);
    };
  }
}

function escapeHtml(str){
  return String(str ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

let deferredInstallPrompt = null;
function isIosDevice(){ return /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream; }
function isStandaloneApp(){ return window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; }

window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredInstallPrompt = e;
  showInstallBanner('android');
});

function showInstallBanner(kind){
  if(isStandaloneApp()) return;
  if(localStorage.getItem('tolerie-install-dismissed')) return;
  const el = document.getElementById('install-banner');
  el.style.display = 'flex';
  el.className = 'install-banner';
  if(kind === 'ios'){
    el.innerHTML = `<span>Sur iPhone : appuie sur <b>Partager</b> puis <b>« Sur l'écran d'accueil »</b> pour installer l'application.</span><button class="close-x" id="install-dismiss">×</button>`;
  }else{
    el.innerHTML = `<span>Installe cette application sur ton écran d'accueil pour un accès rapide.</span><button class="btn small" id="install-go">Installer</button><button class="close-x" id="install-dismiss">×</button>`;
    document.getElementById('install-go').addEventListener('click', async ()=>{
      if(!deferredInstallPrompt) return;
      deferredInstallPrompt.prompt();
      await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;
      el.style.display = 'none';
    });
  }
  document.getElementById('install-dismiss').addEventListener('click', ()=>{
    el.style.display = 'none';
    localStorage.setItem('tolerie-install-dismissed', '1');
  });
}

if(isIosDevice() && !isStandaloneApp()){
  showInstallBanner('ios');
}

/* ---------------------------------------------------------
   EMBOUTISSAGE — PIÈCE
   (reprend le classeur « calcul prix outillage & matériaux » :
   feuille "pièce FERM INF PIED AVT" — mêmes données, mêmes formules)
--------------------------------------------------------- */
function defaultEmbPiece(){
  return {
    nom: '',
    qteLancement: 5,
    epaisseur: 1.5,
    longueurFlanc: 1000,
    largeurFlanc: 500,
    nbDecoupes: 0,
    diametreDecoupes: 5,
    nbPli: 0,
    nbSoudures: 0,
    vitesseLaser: 2000,
    vitesseDebit: 50,
    hauteurCoupeDebit: 0,
    tempsEmboutissageMin: 0,
    tempsPliageMin: 0,
    tempsMontageOutilMin: 0,
    decoupesLaser5axes: 0,
    tempsControleMin: 0,
    coutAdmin: 30,
    coutAccessoire: 0,
    coutMatiere: 0,
    coutEmballage: 5,
    coutSousTraitance: 0,
    coutDivers: 0,
    margeAppliquee: 0.25,
    pieceFileName: '',
    dateCreation: null, dateModification: null
  };
}

function computePiece(p){
  const poidsPiece = (p.longueurFlanc * p.largeurFlanc) * p.epaisseur * (8/1000000);
  const longueurCoupe = (p.longueurFlanc + p.largeurFlanc + (p.nbDecoupes/2*3.2*p.diametreDecoupes)) * 2;
  const tempsDecoupeMin = p.vitesseLaser>0 ? longueurCoupe / p.vitesseLaser : 0;
  const tempsDebitMin = 0.5 + (p.vitesseDebit>0 ? p.hauteurCoupeDebit / p.vitesseDebit : 0);

  const tLaserH = longueurCoupe===0 ? 0 : (15 + tempsDecoupeMin*p.qteLancement)/60;
  const tDebitH = p.hauteurCoupeDebit===0 ? 0 : (7 + tempsDebitMin*p.qteLancement)/60;
  const tEmbH = p.nbPli===0 ? 0 : (15 + p.tempsEmboutissageMin*p.qteLancement)/60;
  const tPliageH = (p.tempsPliageMin*p.qteLancement)/60;
  const tMontageH = p.tempsMontageOutilMin===0 ? 0 : (7 + p.tempsMontageOutilMin*p.qteLancement)/60;
  const tLaser5axH = p.decoupesLaser5axes===0 ? 0 : (30 + p.decoupesLaser5axes*p.qteLancement)/60;
  const tCondH = p.tempsControleMin===0 ? 0 : (7 + p.tempsControleMin*p.qteLancement)/60;
  const tempsTotalH = tLaserH+tDebitH+tEmbH+tPliageH+tMontageH+tLaser5axH+tCondH;

  const coutLaser = tLaserH*115;
  const coutDebit = tDebitH*65;
  const coutEmbFab = tEmbH*90;
  const coutPliage = tPliageH*90;
  const coutRepriseMontage = tMontageH*65;
  const coutLaser5Ax = tLaser5axH*150;
  const coutCondition = tCondH*40;

  const poidsLot = poidsPiece*p.qteLancement;
  const coutLogistique = poidsLot < 30 ? 25 : (poidsLot < 100 ? poidsLot*0.5 : poidsLot*0.35);

  const coutGlobal = (p.coutAdmin||0) + (p.coutAccessoire||0) + (p.coutMatiere||0) + coutLaser + coutDebit + coutEmbFab + coutPliage
    + coutRepriseMontage + coutLaser5Ax + coutCondition + (p.coutEmballage||0) + (p.coutSousTraitance||0) + coutLogistique + (p.coutDivers||0);
  const coutPieceUnit = p.qteLancement>0 ? coutGlobal/p.qteLancement : 0;
  const prixVente = coutPieceUnit + coutPieceUnit*(p.margeAppliquee||0);
  const prixVenteGlobal = prixVente*p.qteLancement;

  return { poidsPiece, longueurCoupe, tempsDecoupeMin, tempsDebitMin,
    tLaserH, tDebitH, tEmbH, tPliageH, tMontageH, tLaser5axH, tCondH, tempsTotalH,
    coutLaser, coutDebit, coutEmbFab, coutPliage, coutRepriseMontage, coutLaser5Ax, coutCondition, coutLogistique,
    coutGlobal, coutPieceUnit, prixVente, prixVenteGlobal };
}

  };
  embPieces.forEach(p=>{
    const editBtn = document.querySelector(`[data-emb-edit="${p.id}"]`);
    if(editBtn) editBtn.onclick = ()=>{ embPieceEditing = JSON.parse(JSON.stringify(p)); embPieceWireframe = null; render(); };
    const delBtn = document.querySelector(`[data-emb-del="${p.id}"]`);
    if(delBtn) delBtn.onclick = async ()=>{

      await saveEmbPieces();

      renderEmbPieceForm();

      console.error(err);
      toast('Impossible de lire ce fichier : ' + err.message);
    }
  };

  document.getElementById('ep-save').onclick = async ()=>{
    if(!p.nom || !p.nom.trim()){ toast('Indique une désignation pour la pièce'); return; }
    if(!p.dateCreation) p.dateCreation = new Date().toISOString();
    const idx = embPieces.findIndex(x=>x.id===p.id);
    if(idx>=0) embPieces[idx] = p; else embPieces.push(p);
    await saveEmbPieces();
    toast('Pièce enregistrée');
    embPieceEditing = null;
    embPieceWireframe = null;
    render();
  };
  document.getElementById('ep-cancel').onclick = ()=>{ embPieceEditing = null; embPieceWireframe = null; render(); };

  if(embPieceWireframe){ attachDxfZoomPan('step-viewer-piece'); }

/* Densité de l'acier (kg/m³), utilisée pour chiffrer le poids — donc le coût matière —
   de la matrice, du poinçon et du serre-flan à partir de leur seul volume. */
const DENSITE_ACIER_KG_M3 = 7850;

/* Cherche dans l'abaque d'usinage le bloc dont le volume est le plus proche de celui demandé
   (longueur/largeur/hauteur en mm) — sert uniquement à estimer le temps d'usinage (ligne
   "Usinage" de la main d'oeuvre), le coût matière étant calculé par poids × prix/kg. */
function findAbaqueMatch(l, w, h){
  if(!l || !w || !h) return null;
  const vol = l*w*h*1e-9;
  let best = null, bestDiff = Infinity;
  ABAQUE_USINAGE.forEach(a=>{
    const v = a.l*a.w*a.h*1e-9;
    const diff = Math.abs(v-vol);
    if(diff < bestDiff){ bestDiff = diff; best = a; }
  });
  if(!best) return null;
  return { ref: best, volumeDemande: vol, prixUsinage: best.prixUsinage, prixMatiere: best.prixMatiere, nbHeureUsinage: best.prixUsinage/85 };
}

/* Lecture approximative d'un fichier STEP : boîte englobante 3D à partir des sommets réels de la
   pièce (VERTEX_POINT). Comme pour l'imbrication, c'est une approximation (pas de vraie géométrie
   CAO) — à vérifier. On exclut volontairement les CARTESIAN_POINT qui ne sont pas des sommets
   (origines de repères, points de construction des courbes) : les inclure fait exploser la boîte
   englobante, en général jusqu'à l'origine (0,0,0) du repère global de l'assemblage. */
function parseStepBoundingBox3D(text){
  const pts = stepCartesianPoints(text);
  const vertexRe = /VERTEX_POINT\s*\(\s*'[^']*'\s*,\s*#(\d+)\s*\)/g;
  let m, minX=Infinity, minY=Infinity, minZ=Infinity, maxX=-Infinity, maxY=-Infinity, maxZ=-Infinity, found=0;
  while((m = vertexRe.exec(text))){
    const v = pts[m[1]];
    if(!v || v.length<3) continue;
    found++;
    if(v[0]<minX)minX=v[0]; if(v[0]>maxX)maxX=v[0];
    if(v[1]<minY)minY=v[1]; if(v[1]>maxY)maxY=v[1];
    if(v[2]<minZ)minZ=v[2]; if(v[2]>maxZ)maxZ=v[2];
  }
  if(!found){
    Object.values(pts).forEach(v=>{
      if(v.length<3) return;
      if(v[0]<minX)minX=v[0]; if(v[0]>maxX)maxX=v[0];
      if(v[1]<minY)minY=v[1]; if(v[1]>maxY)maxY=v[1];
      if(v[2]<minZ)minZ=v[2]; if(v[2]>maxZ)maxZ=v[2];
    });
  }
  if(!isFinite(minX)) throw new Error('Aucun point exploitable trouvé dans le fichier STEP.');
  const longueur = Math.round(maxX-minX), largeur = Math.round(maxY-minY), hauteur = Math.round(maxZ-minZ);
  return { longueur, largeur, hauteur, volume: (longueur*largeur*hauteur)/1e9 };
}

/* ---------------------------------------------------------
   VISUALISATION APPROXIMATIVE D'UN FICHIER STEP (fil de fer)
   On reconstruit chaque arête de la pièce (EDGE_CURVE) :
   - les arêtes portées par une B-spline (B_SPLINE_CURVE_WITH_KNOTS, non rationnelle) sont
     échantillonnées par l'algorithme de De Boor pour suivre la vraie courbe ;
   - les autres (LINE, CIRCLE...) sont tracées en corde droite entre les deux sommets de l'arête.
   C'est une approximation filaire (pas un rendu solide), suffisante pour vérifier la forme
   générale de la pièce avant usinage de l'outil.
--------------------------------------------------------- */
function parseStepWireframe(text){
  const pts = stepCartesianPoints(text);

  const vertexPt = {};
  const vertexRe = /#(\d+)\s*=\s*VERTEX_POINT\s*\(\s*'[^']*'\s*,\s*#(\d+)\s*\)/g;
  let m;
  while((m = vertexRe.exec(text))){ const p = pts[m[2]]; if(p) vertexPt[m[1]] = p; }

  const bsplines = {};
  const bsRe = /#(\d+)\s*=\s*B_SPLINE_CURVE_WITH_KNOTS\s*\(\s*'[^']*'\s*,\s*(\d+)\s*,\s*\(([^)]+)\)\s*,[^,]+,[^,]+,[^,]+,\s*\(([^)]+)\)\s*,\s*\(([^)]+)\)/g;
  while((m = bsRe.exec(text))){
    bsplines[m[1]] = {
      degree: parseInt(m[2], 10),
      cpIds: m[3].split(',').map(s=>s.trim().replace('#','')),
      knotMult: m[4].split(',').map(s=>parseInt(s.trim(),10)),
      knotVals: m[5].split(',').map(s=>parseFloat(s.trim()))
    };
  }

  const edges = [];
  const edgeRe = /#(\d+)\s*=\s*EDGE_CURVE\s*\(\s*'[^']*'\s*,\s*#(\d+)\s*,\s*#(\d+)\s*,\s*#(\d+)\s*,\s*\.[TF]\.\s*\)/g;
  while((m = edgeRe.exec(text))){ edges.push({ v1:m[2], v2:m[3], curve:m[4] }); }

  function expandKnots(mult, vals){
    const out = [];
    for(let i=0;i<mult.length;i++) for(let j=0;j<mult[i];j++) out.push(vals[i]);
    return out;
  }
  // Algorithme de De Boor : évalue un point sur une B-spline (non rationnelle) de degré p,
  // vecteur de noeuds U, points de contrôle Pw, au paramètre u.
  function deBoor(p, U, Pw, u){
    const n = Pw.length - 1;
    let k = p;
    while(k < n && u >= U[k+1]) k++;
    if(u >= U[U.length-1-p]) k = n;
    const d = [];
    for(let i=0;i<=p;i++) d[i] = Pw[k-p+i].slice();
    for(let r=1;r<=p;r++){
      for(let i=p;i>=r;i--){
        const denom = U[k+1+i-r] - U[k+i-p];
        const alpha = denom!==0 ? (u - U[k+i-p])/denom : 0;
        d[i] = [0,1,2].map(ax => (1-alpha)*d[i-1][ax] + alpha*d[i][ax]);
      }
    }
    return d[p];
  }

  const polylines = [];
  edges.forEach(e=>{
    const p1 = vertexPt[e.v1], p2 = vertexPt[e.v2];
    if(!p1 || !p2) return;
    const bs = bsplines[e.curve];
    if(bs){
      const cps = bs.cpIds.map(id=>pts[id]);
      if(cps.every(Boolean) && cps.length > bs.degree){
        const U = expandKnots(bs.knotMult, bs.knotVals);
        const uStart = U[bs.degree], uEnd = U[U.length-1-bs.degree];
        const N = 10;
        const line = [];
        for(let i=0;i<=N;i++){
          const u = (i===N) ? uEnd - 1e-9 : uStart + (uEnd-uStart)*(i/N);
          line.push(deBoor(bs.degree, U, cps, u));
        }
        polylines.push(line);
        return;
      }
    }
    polylines.push([p1, p2]);
  });
  return polylines;
}

/* Construit le SVG du viewer (projection 2D sur les deux axes de plus grande étendue).
   mirrorPolylines, si fourni, est tracé en plus (en rouge) — utilisé pour prévisualiser
   la pièce et son symétrique côte à côte. */
function buildStepWireframeSvg(polylines, mirrorPolylines){
  const allPts = [];
  polylines.forEach(line=>line.forEach(p=>allPts.push(p)));
  if(mirrorPolylines) mirrorPolylines.forEach(line=>line.forEach(p=>allPts.push(p)));
  if(!allPts.length) return '<div class="empty" style="padding:24px;">Aucune géométrie exploitable dans ce fichier.</div>';

  const ranges = [0,1,2].map(ax=>{
    let mn=Infinity, mx=-Infinity;
    allPts.forEach(p=>{ if(p[ax]<mn)mn=p[ax]; if(p[ax]>mx)mx=p[ax]; });
    return { ax, mn, mx, span: mx-mn };
  }).sort((a,b)=> b.span - a.span);
  const uRange = ranges[0], vRange = ranges[1];

  const w = Math.max(1, uRange.span), h = Math.max(1, vRange.span);
  const pad = Math.max(w,h)*0.05;
  const vbW = w+pad*2, vbH = h+pad*2;
  const sx = p => (p[uRange.ax]-uRange.mn+pad).toFixed(2);
  const sy = p => (vbH - (p[vRange.ax]-vRange.mn+pad)).toFixed(2);
  const strokeW = (Math.max(w,h)*0.0025).toFixed(3);

  function pathFor(lines, color){
    return lines.map(line=>{
      const d = line.map(p=>`${sx(p)},${sy(p)}`).join(' ');
      return `<polyline points="${d}" fill="none" stroke="${color}" stroke-width="${strokeW}"/>`;
    }).join('');
  }

  return `<svg width="100%" height="100%" viewBox="0 0 ${vbW} ${vbH}" preserveAspectRatio="xMidYMid meet" style="background:#fff;display:block;">
    <g>${pathFor(polylines, '#1a1a1a')}</g>
    ${mirrorPolylines ? `<g>${pathFor(mirrorPolylines, '#c1443c')}</g>` : ''}
  </svg>`;
}

/* Calcule la pièce symétrique (miroir sur l'axe X=0 ou Y=1), accolée avec un espace de 50 mm,
   pour une prévisualisation côte à côte — même logique que l'effet "symétrique" de l'outillage. */
function mirrorStepWireframe(polylines, axisIndex, gap){
  let mx = -Infinity;
  polylines.forEach(line=>line.forEach(p=>{ if(p[axisIndex]>mx) mx=p[axisIndex]; }));
  if(!isFinite(mx)) return polylines;
  return polylines.map(line=>line.map(p=>{
    const q = p.slice();
    q[axisIndex] = 2*mx + gap - p[axisIndex];
    return q;
  }));
}

function computeOutil(o){
  // Outillage symétrique : si l'outil produit la pièce et son symétrique en une seule frappe,
  // on double la dimension pièce sur l'axe choisi (X ou Y) et on ajoute 50 mm (espace entre les deux moitiés)
  // avant de dimensionner matrice / poinçon / serre-flan.
  const isSym = o.symetrique === true;
  const symAxe = o.symetrieAxe === 'Y' ? 'Y' : 'X';
  const effLongueur = (isSym && symAxe==='X') ? (o.pieceLongueur*2 + 50) : o.pieceLongueur;
  const effLargeur = (isSym && symAxe==='Y') ? (o.pieceLargeur*2 + 50) : o.pieceLargeur;

  // Dimensions calculées automatiquement — modifiables ensuite à la main (override), sinon elles suivent la formule.
  const matriceLCalc = effLongueur+160, matriceWCalc = effLargeur+160, matriceHCalc = o.pieceHauteur+50;
  const poinconLCalc = effLongueur, poinconWCalc = effLargeur, poinconHCalc = Math.max(o.pieceHauteur+50, 100);
  const matriceL = o.matriceLOverride!=null ? o.matriceLOverride : matriceLCalc;
  const matriceW = o.matriceWOverride!=null ? o.matriceWOverride : matriceWCalc;
  const matriceH = o.matriceHOverride!=null ? o.matriceHOverride : matriceHCalc;
  const poinconL = o.poinconLOverride!=null ? o.poinconLOverride : poinconLCalc;
  const poinconW = o.poinconWOverride!=null ? o.poinconWOverride : poinconWCalc;
  const poinconH = o.poinconHOverride!=null ? o.poinconHOverride : poinconHCalc;
  const hasSerreFlan = o.hasSerreFlan !== false;
  const serreFlanL = hasSerreFlan ? matriceL : 0, serreFlanW = hasSerreFlan ? matriceW : 0, serreFlanH = hasSerreFlan ? 30 : 0;

  // Coût matière = volume (m³) × densité acier (kg/m³) = poids (kg) × prix/kg (42CMD8, par défaut 4€).
  const prixKg = o.prixKgMatiere != null ? o.prixKgMatiere : 4;
  const matriceVolume = matriceL*matriceW*matriceH*1e-9;
  const matricePoids = matriceVolume*DENSITE_ACIER_KG_M3;
  const matriceCoutMatiere = matricePoids*prixKg;
  const poinconVolume = poinconL*poinconW*poinconH*1e-9;
  const poinconPoids = poinconVolume*DENSITE_ACIER_KG_M3;
  const poinconCoutMatiere = poinconPoids*prixKg;
  const serreFlanVolume = hasSerreFlan ? serreFlanL*serreFlanW*serreFlanH*1e-9 : 0;
  const serreFlanPoids = serreFlanVolume*DENSITE_ACIER_KG_M3;
  const serreFlanCoutMatiere = hasSerreFlan ? serreFlanPoids*prixKg : 0;

  const matiereTotal = matriceCoutMatiere + poinconCoutMatiere + serreFlanCoutMatiere;

  // Coût d'usinage de la matrice et du poinçon = leur volume (m³) × le prix moyen au m³ de
  // l'abaque d'usinage (par défaut) — modifiable. Le temps (heures) qui en découle vient
  // alimenter automatiquement la ligne "Usinage" de la main d'oeuvre, tant que l'utilisateur
  // n'a pas saisi sa propre valeur.
  const prixUsinageM3 = o.prixUsinageM3 != null ? o.prixUsinageM3 : abaqueMoyennePrixM3();
  const matriceCoutUsinage = matriceVolume*prixUsinageM3;
  const poinconCoutUsinage = poinconVolume*prixUsinageM3;
  const usinageRowDef = (o.moRows||[]).find(r=>r.key==='usinage') || {};
  const tarifUsinageG = usinageRowDef.chg || 120;
  const tarifUsinageD = usinageRowDef.chd || 120;
  const matriceHeuresUsinageG = tarifUsinageG>0 ? matriceCoutUsinage/tarifUsinageG : 0;
  const poinconHeuresUsinageG = tarifUsinageG>0 ? poinconCoutUsinage/tarifUsinageG : 0;
  const matriceHeuresUsinageD = tarifUsinageD>0 ? matriceCoutUsinage/tarifUsinageD : 0;
  const poinconHeuresUsinageD = tarifUsinageD>0 ? poinconCoutUsinage/tarifUsinageD : 0;
  const heuresUsinageAutoG = matriceHeuresUsinageG + poinconHeuresUsinageG;
  const heuresUsinageAutoD = matriceHeuresUsinageD + poinconHeuresUsinageD;

  const rows = (o.moRows||[]).map(r=>{
    const on = r.enabled !== false;
    let hg = r.hg, hd = r.hd;
    if(r.key==='usinage' && (hg==null || hg==='')) hg = heuresUsinageAutoG;
    if(r.key==='usinage' && (hd==null || hd==='')) hd = heuresUsinageAutoD;
    hg = hg||0; hd = hd||0;
    return Object.assign({}, r, { hg, hd, totG: on ? hg*(r.chg||0) : 0, totD: on ? hd*(r.chd||0) : 0 });
  });
  const sumG = rows.reduce((s,r)=>s+r.totG,0);
  const sumD = rows.reduce((s,r)=>s+r.totD,0);
  const totalMainG = sumG + matiereTotal;
  const totalMainD = sumD + matiereTotal;
  return { matriceL, matriceW, matriceH, poinconL, poinconW, poinconH, serreFlanL, serreFlanW, serreFlanH, hasSerreFlan,
    matriceLCalc, matriceWCalc, matriceHCalc, poinconLCalc, poinconWCalc, poinconHCalc,
    isSym, symAxe, effLongueur, effLargeur,
    matriceVolume, matricePoids, matriceCoutMatiere,
    poinconVolume, poinconPoids, poinconCoutMatiere,
    serreFlanVolume, serreFlanPoids, serreFlanCoutMatiere,
    prixKg, prixUsinageM3, matriceCoutUsinage, poinconCoutUsinage,
    matriceHeuresUsinageG, poinconHeuresUsinageG, heuresUsinageAutoG, heuresUsinageAutoD,
    matiereTotal, rows, sumG, sumD, totalMainG, totalMainD };
}

/* Prix moyen au m³ de l'abaque d'usinage (prix usinage / volume de chaque bloc, moyenné) —
   valeur par défaut utilisée pour chiffrer l'usinage de la matrice et du poinçon à partir
   de leur seul volume. */
function abaqueMoyennePrixM3(){
  const vals = ABAQUE_USINAGE.map(a=>{ const v=a.l*a.w*a.h*1e-9; return v>0 ? a.prixUsinage/v : 0; }).filter(v=>v>0);
  return vals.length ? vals.reduce((s,v)=>s+v,0)/vals.length : 0;
}

let embOutilWireframe = null; // polylignes 3D de la pièce chargée (fil de fer), non persisté

    ${embOutils.length ? `
      <div class="table-wrap">

          <thead><tr><th>Désignation</th><th>Pièce (L×l×h)</th><th>Matière outil</th><th>Total MAIN G</th><th>Total MAIN D</th><th>Modifié le</th><th></th></tr></thead>

    <details style="margin-top:28px;">

        <table style="min-width:760px;">

          <tbody>
            ${ABAQUE_USINAGE.map(a=>{
              const vol = a.l*a.w*a.h*1e-9;
              const prixM3 = vol>0 ? a.prixUsinage/vol : 0;
              const heures = a.prixUsinage/85;
              return `<tr>
                <td>${a.l}</td><td>${a.w}</td><td>${a.h}</td><td>${a.prixMatiere!=null?a.prixMatiere+' €':'—'}</td><td>${a.prixUsinage} €</td><td>${escapeHtml(a.note||'—')}</td>

  };
  embOutils.forEach(o=>{

  document.getElementById('eo-nom').onchange = (e)=>{ o.nom = e.target.value; };
  document.getElementById('eo-has-serreflan').onchange = (e)=>{ o.hasSerreFlan = e.target.checked; renderEmbOutilForm(); };
  document.getElementById('eo-prix-kg').onchange = (e)=>{ o.prixKgMatiere = parseFloat(e.target.value) || 0; renderEmbOutilForm(); };
  document.getElementById('eo-prix-usinage-m3').onchange = (e)=>{ o.prixUsinageM3 = parseFloat(e.target.value) || 0; renderEmbOutilForm(); };
  document.getElementById('eo-symetrique').onchange = (e)=>{
    o.symetrique = e.target.checked;
    o.matriceLOverride = o.matriceWOverride = o.matriceHOverride = null;
    o.poinconLOverride = o.poinconWOverride = o.poinconHOverride = null;
    renderEmbOutilForm();
  };
  const symAxeSel = document.getElementById('eo-symetrie-axe');
  if(symAxeSel) symAxeSel.onchange = (e)=>{
    o.symetrieAxe = e.target.value;
    o.matriceLOverride = o.matriceWOverride = o.matriceHOverride = null;
    o.poinconLOverride = o.poinconWOverride = o.poinconHOverride = null;
    renderEmbOutilForm();
  };

  document.querySelectorAll('[data-mo-field]').forEach(inp=>{
    inp.onchange = (e)=>{
      const idx = parseInt(e.target.dataset.moIdx);
      const f = e.target.dataset.moField;
      if(f==='label') o.moRows[idx][f] = e.target.value;
      else if(f==='enabled') o.moRows[idx][f] = e.target.checked;
      else o.moRows[idx][f] = parseFloat(e.target.value)||0;
      renderEmbOutilForm();
    };
  });
  document.querySelectorAll('[data-mo-del]').forEach(btn=>{
    btn.onclick = ()=>{
      const idx = parseInt(btn.dataset.moDel);
      o.moRows.splice(idx,1);
      renderEmbOutilForm();
    };
  });
  document.getElementById('eo-add-row').onclick = ()=>{
    o.moRows.push({ key:'', label:'', enabled:true, hg:0, chg:0, hd:0, chd:0 });
    renderEmbOutilForm();
  };

  document.getElementById('eo-step-file').onchange = async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    try{
      const text = await file.text();
      const bbox = parseStepBoundingBox3D(text);
      o.pieceLongueur = bbox.longueur; o.pieceLargeur = bbox.largeur; o.pieceHauteur = bbox.hauteur;
      o.pieceFileName = file.name;
      o.nom = file.name.replace(/\.(stp|step)$/i, '');
      o.matriceLOverride = o.matriceWOverride = o.matriceHOverride = null;
      o.poinconLOverride = o.poinconWOverride = o.poinconHOverride = null;
      try{ embOutilWireframe = parseStepWireframe(text); }catch(werr){ console.error(werr); embOutilWireframe = null; }
      toast(`Pièce lue : ${bbox.longueur} × ${bbox.largeur} × ${bbox.hauteur} mm (volume ≈ ${bbox.volume.toFixed(5)} m³)`);
      renderEmbOutilForm();
    }catch(err){
      console.error(err);
      toast('Impossible de lire ce fichier : ' + err.message);
    }
  };

  document.getElementById('eo-save').onclick = async ()=>{
    if(!o.nom || !o.nom.trim()){ toast("Indique une désignation pour l'outil"); return; }
    if(!o.dateCreation) o.dateCreation = new Date().toISOString();
    const idx = embOutils.findIndex(x=>x.id===o.id);
    if(idx>=0) embOutils[idx] = o; else embOutils.push(o);
    await saveEmbOutils();
    toast('Outil enregistré');
    embOutilEditing = null;
    embOutilWireframe = null;
    render();
  };
  document.getElementById('eo-cancel').onclick = ()=>{ embOutilEditing = null; embOutilWireframe = null; render(); };

  if(embOutilWireframe){ attachDxfZoomPan('step-viewer'); }
}

if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(r => r.unregister()));
}
</script>
</body>
</html>
